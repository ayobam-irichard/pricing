<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     THEME TOKENS — tweak these to restyle the whole site at once
     ============================================================ */
  :root{
    /* ---- Quagsire pond palette ---- */
    --bg: #0c2b2a;          /* deep pond water — page canvas */
    --surface: #133c3a;     /* murky water surface — card / section surface */
    --surface-2: #1c4d48;   /* shallower water — elevated surface, hover states */
    --border: #3f7a6d;      /* mossy reed green — borders, dividers (used at reduced opacity below) */
    --highlight: #7ecbd6;   /* Quagsire-belly blue — bright accent, selections, key numbers */
    --accent-pink: #f2a6c6; /* Quagsire cheek pink — used sparingly for playful touches */
    --lily: #a3d977;        /* lily-pad green */
    --text: #eafaf3;        /* foam white — primary text */
    --text-dim: #8fc9c0;    /* secondary text — soft pond mist */
    --text-faint: #5c9188;  /* tertiary / muted text */
    --on-highlight: #073231;/* text color sitting on top of the bright highlight */

    --radius: 16px;
    --radius-sm: 10px;
    --font-display: 'Baloo 2', sans-serif;
    --font-body: 'Nunito', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-x:hidden;}
  body{
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(163,217,119,0.14), transparent 60%),
      radial-gradient(1100px 650px at 85% 8%, rgba(126,203,214,0.14), transparent 55%),
      radial-gradient(900px 700px at 10% 90%, rgba(163,217,119,0.10), transparent 60%),
      radial-gradient(1100px 700px at 95% 95%, rgba(126,203,214,0.10), transparent 55%),
      linear-gradient(180deg, #0d2f2d 0%, #0a2422 55%, #082019 100%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- drifting pond backdrop ---------- */
  .pond-decor{
    position:fixed; inset:0; z-index:0;
    overflow:hidden; pointer-events:none;
  }
  .pond-decor .pad{
    position:absolute;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 8px 14px rgba(2,16,15,0.35));
  }
  .pond-decor .pad svg{ width:100%; height:100%; display:block; }
  .pond-decor .pad.path-a{ animation-name:padPathA; }
  .pond-decor .pad.path-b{ animation-name:padPathB; }
  .pond-decor .pad.path-c{ animation-name:padPathC; }
  .pond-decor .pad.path-d{ animation-name:padPathD; }
  .pond-decor .ring{
    position:absolute; border-radius:50%;
    animation:orbit ease-in-out infinite;
  }
  .pond-decor .ring::before{
    content:"";
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(126,203,214,0.2);
    animation:ripple 6s ease-out infinite;
  }
  .pond-decor .bubble{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(234,250,243,0.5), rgba(126,203,214,0.08) 70%);
    animation:bubbleFloat ease-in-out infinite;
  }
  .pond-decor .firefly{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(234,250,243,0.95), rgba(163,217,119,0.5) 55%, transparent 75%);
    box-shadow:0 0 8px 2px rgba(163,217,119,0.5);
    animation:fireflyDrift ease-in-out infinite, fireflyFlicker ease-in-out infinite;
  }
  .pond-decor .reed{
    position:absolute; bottom:-2%;
    transform-origin:bottom center;
    animation:reedSway ease-in-out infinite;
    opacity:0.55;
  }
  .pond-decor .reed svg{ width:100%; height:100%; display:block; }
  /* soft vignette to deepen the edges and make the glass panel pop */
  .pond-vignette{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, transparent 45%, rgba(4,16,15,0.55) 100%);
  }
  @keyframes fireflyDrift{
    0%   { transform:translate(0,0); }
    30%  { transform:translate(8vw,-6vh); }
    60%  { transform:translate(-5vw,-11vh); }
    100% { transform:translate(0,0); }
  }
  @keyframes fireflyFlicker{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.9; }
  }
  @keyframes reedSway{
    0%,100%{ transform:rotate(-3deg); }
    50%{ transform:rotate(3deg); }
  }
  /* Each pad path wanders across a large chunk of the viewport in a
     fixed, repeating loop — up/down/left/right, not just one corner.
     Durations are long (60–110s) so the motion stays slow and calm. */
  @keyframes padPathA{
    0%   { transform:translate(0,0) rotate(0deg); }
    18%  { transform:translate(26vw,-14vh) rotate(8deg); }
    38%  { transform:translate(14vw,22vh) rotate(-6deg); }
    58%  { transform:translate(-18vw,30vh) rotate(5deg); }
    80%  { transform:translate(-24vw,-6vh) rotate(-8deg); }
    100% { transform:translate(0,0) rotate(0deg); }
  }
  @keyframes padPathB{
    0%   { transform:translate(0,0) rotate(0deg); }
    22%  { transform:translate(-22vw,16vh) rotate(-7deg); }
    45%  { transform:translate(-8vw,-24vh) rotate(6deg); }
    68%  { transform:translate(22vw,-12vh) rotate(-5deg); }
    88%  { transform:translate(16vw,18vh) rotate(7deg); }
    100% { transform:translate(0,0) rotate(0deg); }
  }
  @keyframes padPathC{
    0%   { transform:translate(0,0) rotate(0deg); }
    20%  { transform:translate(16vw,20vh) rotate(6deg); }
    42%  { transform:translate(-14vw,28vh) rotate(-8deg); }
    64%  { transform:translate(-26vw,4vh) rotate(5deg); }
    85%  { transform:translate(-6vw,-18vh) rotate(-6deg); }
    100% { transform:translate(0,0) rotate(0deg); }
  }
  @keyframes padPathD{
    0%   { transform:translate(0,0) rotate(0deg); }
    25%  { transform:translate(-18vw,-18vh) rotate(-6deg); }
    50%  { transform:translate(20vw,-26vh) rotate(8deg); }
    72%  { transform:translate(28vw,10vh) rotate(-5deg); }
    90%  { transform:translate(4vw,20vh) rotate(6deg); }
    100% { transform:translate(0,0) rotate(0deg); }
  }
  @keyframes orbit{
    0%   { transform:translate(0,0); }
    25%  { transform:translate(22px,-18px); }
    50%  { transform:translate(2px,-34px); }
    75%  { transform:translate(-20px,-14px); }
    100% { transform:translate(0,0); }
  }
  @keyframes ripple{
    0%   { transform:scale(0.4); opacity:0.6; }
    100% { transform:scale(1.9); opacity:0; }
  }
  @keyframes bubbleFloat{
    0%   { transform:translate(0,0); opacity:0; }
    12%  { opacity:0.7; }
    88%  { opacity:0.5; }
    100% { transform:translate(10px,-46px); opacity:0; }
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.01em; font-weight:600;}
  .mono{font-family:var(--font-mono);}
  button{font-family:inherit; cursor:pointer;}
  img{max-width:100%; display:block;}
  a{color:inherit;}

  /* layout shell — floating glass pane over the pond */
  .page-shell{
    position:relative; z-index:1;
    max-width:720px; margin:18px auto 32px; padding:0 14px;
  }
  #app{
    position:relative;
    background:rgba(19,60,58,0.42);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(126,203,214,0.22);
    border-radius:22px;
    box-shadow:0 24px 60px rgba(2,16,15,0.45), inset 0 1px 0 rgba(234,250,243,0.05);
    padding:4px 20px 150px;
  }
  @media (min-width:540px){
    .page-shell{ margin-top:28px; padding:0 24px; }
    #app{ padding:8px 28px 150px; }
  }

  /* ---------- top banner (gif) ---------- */
  .site-banner{
    position:relative; z-index:1;
    max-width:720px; margin:14px auto 0; padding:0 14px;
  }
  @media (min-width:540px){ .site-banner{ padding:0 24px; } }
  .site-banner .banner-inner{
    position:relative;
    overflow:hidden;
    aspect-ratio:3.2 / 1;
    border-radius:20px;
    background:
      radial-gradient(60% 90% at 20% 100%, rgba(163,217,119,0.35), transparent 70%),
      radial-gradient(50% 80% at 85% 90%, rgba(126,203,214,0.30), transparent 70%),
      linear-gradient(180deg, #0e3532 0%, #0a2422 100%);
    border:1px solid rgba(126,203,214,0.25);
    box-shadow:0 16px 40px rgba(2,16,15,0.4);
  }
  .site-banner img,
  .site-banner video{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .site-banner .banner-placeholder{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; text-align:center; padding:0 20px;
    color:var(--text-dim);
  }
  .site-banner .banner-placeholder .ripple{
    width:38px; height:38px; color:var(--highlight); opacity:0.85;
  }
  .site-banner .banner-placeholder span{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.02em;
  }
  .site-banner .banner-inner::after{
    /* soft water-line shimmer along the bottom edge of the banner */
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:14px;
    background:linear-gradient(180deg, transparent, rgba(126,203,214,0.18));
    pointer-events:none;
  }

  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:24px 0 20px;
  }
  .topbar .mark{
    width:30px; height:30px; flex:none; border-radius:8px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    animation:markBob 4s ease-in-out infinite;
  }
  @keyframes markBob{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-3px) rotate(-4deg); } }
  .topbar .mark svg{width:16px; height:16px; color:var(--highlight);}
  .topbar .brand{font-family:var(--font-display); font-weight:600; font-size:14.5px; color:var(--text);}
  .topbar .tag{
    margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  }

  /* ---------- commission slots indicator ---------- */
  .slots-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap:wrap;
    padding:14px 16px;
    margin:2px 0 26px;
    background:rgba(19,60,58,0.4);
    border:1px solid rgba(126,203,214,0.2);
    border-radius:14px;
    transition:border-color .25s ease;
  }
  .slots-card.low{ border-color:rgba(242,166,198,0.45); }
  .slots-card .slots-label{ display:flex; flex-direction:column; gap:3px; }
  .slots-card .slots-label .stamp{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--text-dim);
  }
  .slots-card .slots-label .count{ font-family:var(--font-display); font-size:15px; color:var(--text); transition:color .25s ease; }
  .slots-card.low .slots-label .count{ color:var(--accent-pink); }
  .slots-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .slots-row .slot{ width:28px; height:28px; flex:0 0 auto; }
  .slots-row .slot svg{ width:100%; height:100%; display:block; }
  .slots-row .slot:not(.empty){ animation:padGlow 3.2s ease-in-out infinite; }
  .slots-row .slot:not(.empty):nth-child(2n){ animation-delay:0.6s; }
  .slots-row .slot:not(.empty):nth-child(3n){ animation-delay:1.2s; }
  .slots-row .slot.empty{
    border-radius:50%;
    background:rgba(4,20,19,0.6);
    border:1.5px solid rgba(126,203,214,0.16);
  }
  @keyframes padGlow{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(126,203,214,0)); }
    50%{ filter:drop-shadow(0 0 5px rgba(126,203,214,0.6)); }
  }

  /* ---------- home / nav screen ---------- */
  .intro{padding:6px 0 30px;}
  .intro .eyebrow{font-size:13px; color:var(--highlight); margin-bottom:10px; font-weight:500;}
  .intro h1{font-size:29px; line-height:1.28; color:var(--text); max-width:20ch;}
  .intro p{color:var(--text-dim); font-size:14.5px; margin-top:12px; max-width:42ch; line-height:1.6;}

  .nav-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .nav-grid{grid-template-columns:1fr;} }

  .nav-card{
    position:relative; overflow:hidden;
    background:var(--surface);
    border:1px solid rgba(63,122,109,0.35);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    text-align:left;
    display:flex; flex-direction:column; gap:16px;
    transition:background .18s ease, border-color .18s ease, transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
    color:var(--text);
  }
  .nav-card:hover{
    background:var(--surface-2); border-color:rgba(126,203,214,0.5);
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(2,16,15,0.35);
  }
  .nav-card:active{transform:translateY(-1px) scale(0.98);}
  .nav-card .illo{
    width:44px; height:44px; border-radius:10px;
    background:rgba(126,203,214,0.12);
    display:flex; align-items:center; justify-content:center;
    transition:transform .18s ease;
  }
  .nav-card:hover .illo{ transform:scale(1.08) rotate(-4deg); }
  .nav-card .illo svg{width:22px; height:22px; color:var(--highlight);}
  .nav-card h2{font-size:18px; color:var(--text);}
  .nav-card .from-price{font-family:var(--font-mono); font-size:13px; color:var(--text-dim); margin-top:4px;}
  .nav-card .cta{
    margin-top:auto; font-size:13px; color:var(--highlight); font-weight:500;
    display:flex; align-items:center; gap:5px;
  }
  .nav-card .cta svg{width:13px; height:13px; transition:transform .15s ease;}
  .nav-card:hover .cta svg{transform:translateX(3px);}

  /* ---------- "how commissioning works" link + info page ---------- */
  .learn-more-wrap{ margin:22px 0 8px; }
  .learn-more-btn{
    position:relative; overflow:hidden;
    width:100%;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px;
    background:rgba(126,203,214,0.06);
    border:1px dashed rgba(126,203,214,0.35);
    border-radius:14px;
    color:var(--text-dim);
    font-family:var(--font-body); font-size:14px; font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .learn-more-btn:hover{ background:rgba(126,203,214,0.12); border-color:rgba(126,203,214,0.6); color:var(--text); }
  .learn-more-btn:active{ transform:scale(0.98); }
  .learn-more-btn svg{ width:14px; height:14px; flex:none; transition:transform .15s ease; }
  .learn-more-btn:hover svg{ transform:translateX(3px); }

  .info-intro{ color:var(--text-dim); font-size:14.5px; margin-top:12px; max-width:46ch; line-height:1.6; }
  .info-steps{ display:flex; flex-direction:column; gap:16px; margin:22px 0 6px; }
  .info-step{
    background:var(--surface);
    border:1px solid rgba(63,122,109,0.35);
    border-radius:var(--radius-sm);
    padding:16px 18px;
  }
  .info-step h3{ font-size:15.5px; color:var(--highlight); margin-bottom:6px; }
  .info-step p{ color:var(--text-dim); font-size:14px; line-height:1.6; }
  .info-notes{ padding:20px 0 10px; }
  .info-notes h3{ font-size:14px; color:var(--text); margin-bottom:10px; }
  .info-notes ul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; }
  .info-notes li{ color:var(--text-dim); font-size:13.5px; line-height:1.55; }

  /* ---------- detail screen ---------- */
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:none; color:var(--text-dim);
    font-size:13.5px; padding:6px 0; margin-bottom:8px;
    transition:color .15s ease, transform .1s ease;
  }
  .back-btn:hover{color:var(--text);}
  .back-btn:active{transform:translateX(-2px);}
  .back-btn svg{width:14px; height:14px;}

  .page-head{padding:8px 0 6px;}
  .page-head .eyebrow{font-size:12.5px; color:var(--highlight); font-weight:500;}
  .page-head h1{font-size:25px; margin-top:6px;}
  .page-head .base{font-size:13px; color:var(--text-dim); margin-top:8px;}
  .page-head .base .mono{color:var(--highlight);}

  .divider{ height:1px; background:rgba(63,122,109,0.35); margin:28px 0 18px; }

  .section-head{
    display:flex; align-items:baseline; gap:8px;
    margin-bottom:12px;
  }
  .section-head h3{font-size:15.5px; color:var(--text); font-weight:600;}
  .section-head .req{margin-left:auto; font-size:11.5px; color:var(--text-faint);}

  .scroll-row{
    display:flex; gap:10px; overflow-x:auto;
    padding:2px 2px 10px 2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .scroll-row::-webkit-scrollbar{height:5px;}
  .scroll-row::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px; opacity:0.5;}

  .opt-chip{
    position:relative; flex:none; overflow:hidden;
    min-width:132px;
    background:var(--surface);
    border:1px solid rgba(63,122,109,0.35);
    border-radius:var(--radius-sm);
    padding:13px 13px 12px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .opt-chip:hover{border-color:rgba(126,203,214,0.55); transform:translateY(-2px);}
  .opt-chip:active{transform:translateY(0) scale(0.98);}
  .opt-chip .opt-label{font-size:13.5px; font-weight:500; padding-right:16px; display:block;}
  .opt-chip .opt-price{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); margin-top:8px; display:block;}
  .opt-chip .info-btn{
    position:absolute; top:9px; right:9px;
    width:18px; height:18px; border-radius:50%;
    border:1px solid rgba(63,122,109,0.5); background:transparent;
    color:var(--text-dim); font-family:var(--font-mono); font-size:10.5px;
    display:flex; align-items:center; justify-content:center; padding:0;
    line-height:1;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .opt-chip .info-btn:hover{color:var(--text); border-color:var(--highlight); transform:scale(1.1);}

  .opt-chip.selected{
    background:var(--highlight);
    border-color:var(--highlight);
    box-shadow:0 6px 18px rgba(126,203,214,0.35);
  }
  .opt-chip.selected .opt-label{color:var(--on-highlight);}
  .opt-chip.selected .opt-price{color:rgba(7,50,49,0.7); padding-right:20px;}
  .opt-chip.selected .info-btn{border-color:rgba(7,50,49,0.4); color:rgba(7,50,49,0.75);}
  .opt-chip.selected::after{
    content:"✓";
    position:absolute; bottom:9px; right:9px;
    width:16px; height:16px; border-radius:50%;
    background:var(--on-highlight); color:var(--highlight);
    font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    animation:popIn .22s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{ from{ transform:scale(0); opacity:0; } to{ transform:scale(1); opacity:1; } }

  button:focus-visible,
  .opt-chip:focus-visible,
  [data-nav]:focus-visible{
    outline:2px solid var(--highlight); outline-offset:2px; border-radius:8px;
  }

  /* ---------- sticky price bar ---------- */
  .price-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; justify-content:center;
    pointer-events:none;
    padding:0 14px;
  }
  @media (min-width:540px){ .price-bar{ padding:0 24px; } }
  .price-bar-inner{
    pointer-events:auto;
    width:100%; max-width:692px;
    background:rgba(19,60,58,0.65);
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(126,203,214,0.3);
    border-bottom:none;
    border-radius:18px 18px 0 0;
    padding:14px 18px 16px;
    box-shadow:0 -16px 40px rgba(2,16,15,0.5);
  }
  .price-bar-top{display:flex; align-items:center; gap:10px; cursor:pointer; transition:opacity .15s ease;}
  .price-bar-top:active{opacity:0.8;}
  .price-bar-top .label-col{display:flex; flex-direction:column; gap:2px;}
  .price-bar-top .stamp{font-size:12px; color:var(--text-dim);}
  .price-bar-top .total{
    margin-left:auto; font-family:var(--font-mono); font-size:21px; font-weight:600; color:var(--highlight);
  }
  .price-bar-top .chevron{width:14px; height:14px; color:var(--text-dim); transition:transform .2s ease;}
  .price-bar-top .chevron.open{transform:rotate(180deg);}

  .breakdown{
    display:grid; grid-template-rows:0fr;
    overflow:hidden;
    transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1), margin-top .3s ease, padding-top .3s ease;
  }
  .breakdown.open{
    grid-template-rows:1fr;
    margin-top:12px; padding-top:12px; border-top:1px solid rgba(63,122,109,0.3);
  }
  .breakdown-inner{ min-height:0; max-height:220px; overflow-y:auto; }
  .breakdown-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; color:var(--text-dim);}
  .breakdown-row span:last-child{font-family:var(--font-mono); color:var(--text);}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,20,19,0.78);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; padding:0;
    animation:overlayIn .2s ease;
  }
  .modal-overlay.closing{ animation:overlayOut .18s ease forwards; }
  .modal-overlay.closing .modal-card{ animation:modalOut .18s ease forwards; }
  @keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes overlayOut{ from{opacity:1;} to{opacity:0;} }
  @keyframes modalOut{ from{opacity:1; transform:translateY(0) scale(1);} to{opacity:0; transform:translateY(14px) scale(0.97);} }
  @media (min-width:560px){
    .modal-overlay{align-items:center; padding:20px;}
  }
  .modal-card{
    position:relative;
    background:var(--surface);
    border:1px solid rgba(63,122,109,0.35);
    width:100%; max-width:420px;
    border-radius:16px 16px 0 0;
    padding:22px 22px 26px;
    max-height:82vh; overflow-y:auto;
    animation:modalIn .28s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalIn{ from{opacity:0; transform:translateY(24px) scale(0.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @media (min-width:560px){ .modal-card{border-radius:16px;} }
  .modal-card .close{
    position:absolute; top:16px; right:16px;
    width:26px; height:26px; border-radius:50%;
    border:1px solid rgba(63,122,109,0.5); background:transparent; color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:14px;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .modal-card .close:hover{color:var(--text); border-color:var(--highlight); transform:rotate(90deg);}
  .modal-card .eyebrow{color:var(--highlight); font-size:11.5px; font-weight:500;}
  .modal-card h3{font-size:18px; padding-right:30px; margin-top:6px;}
  .modal-card .modal-price{font-family:var(--font-mono); color:var(--highlight); font-size:13px; margin-top:8px;}
  .modal-card .modal-media{margin-top:16px; border-radius:10px; overflow:hidden; border:1px solid rgba(63,122,109,0.3);}
  .modal-card .modal-media img{ transition:transform .35s ease; display:block; }
  .modal-card .modal-media:hover img{ transform:scale(1.05); }
  .modal-card .modal-desc{margin-top:16px; font-size:14px; line-height:1.65; color:var(--text-dim);}

  /* ---------- click ripple feedback ---------- */
  .ripple-fx{
    position:absolute; border-radius:50%;
    background:rgba(234,250,243,0.35);
    transform:scale(0); opacity:0.55;
    animation:rippleFx .55s ease-out forwards;
    pointer-events:none;
  }
  .opt-chip.selected .ripple-fx{ background:rgba(7,50,49,0.25); }
  @keyframes rippleFx{ to{ transform:scale(1); opacity:0; } }

  /* ---------- view transitions (progressive enhancement) ---------- */
  ::view-transition-old(root),
  ::view-transition-new(root){
    animation-duration:0.32s;
    animation-timing-function:cubic-bezier(.4,0,.2,1);
  }

  .fade-in{animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>

/* ================================================================
   Below this line is site logic — no need to edit for normal use.
================================================================ */

const ILLOS = {
  icon: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M6.8 18.2c1-2.1 3-3.2 5.2-3.2s4.2 1.1 5.2 3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  banner: `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="11" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 16l4-3.2 3 2.2 3.5-3.6 5 4.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`
};

const state = {
  route: "home",       // "home" | a key from PAGES
  selections: {},       // { pageKey: { sectionId: optionId } }
  breakdownOpen: false,
  lastTotal: 0          // used to animate the price counter between renders
};

/* Wraps a state-change + re-render in the View Transitions API when the
   browser supports it, for a smooth cross-fade between screens. Falls
   back to an instant update everywhere else. */
function withTransition(fn){
  if(document.startViewTransition){
    document.startViewTransition(fn);
  } else {
    fn();
  }
}

function ensureSelections(pageKey){
  if(state.selections[pageKey]) return;
  const page = PAGES[pageKey];
  const picks = {};
  page.sections.forEach(s => { picks[s.id] = s.options[0].id; });
  state.selections[pageKey] = picks;
}

function calcTotal(pageKey){
  const page = PAGES[pageKey];
  const picks = state.selections[pageKey];
  let total = page.basePrice;
  const lines = [{ label: page.title + " — base", price: page.basePrice }];
  page.sections.forEach(sec => {
    const opt = sec.options.find(o => o.id === picks[sec.id]);
    if(opt){
      total += opt.price;
      lines.push({ label: sec.title + ": " + opt.label, price: opt.price });
    }
  });
  return { total, lines };
}

function go(route){
  withTransition(() => {
    state.route = route;
    state.breakdownOpen = false;
    if(PAGES[route]) ensureSelections(route);
    window.scrollTo(0,0);
    render();
  });
}

function iconChevron(cls){
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconBack(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconArrow(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconMark(){
  return `<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><path d="M11 7.5h5.5a2 2 0 0 1 2 2V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
}

function renderSlots(){
  const max = Math.max(0, SLOTS.max);
  const available = Math.max(0, Math.min(SLOTS.available, max));
  const isLow = available > 0 && available <= 1;
  const isFull = available === 0;

  const pads = Array.from({ length: max }).map((_, i) => {
    if(i < available){
      return `
        <div class="slot" title="Open slot">
          <svg viewBox="0 0 100 100"><path d="M50 6 A44 44 0 1 1 49.9 6 L50 50 Z" fill="var(--lily)" opacity="0.9"/><path d="M50 50 L28 30 M50 50 L20 55 M50 50 L34 75 M50 50 L66 78 M50 50 L80 58" stroke="#2f5a26" stroke-width="2" opacity="0.5"/></svg>
        </div>`;
    }
    return `<div class="slot empty" title="Slot taken"></div>`;
  }).join("");

  const label = isFull ? "Fully booked — check back soon" : `${available} of ${max} open`;

  return `
    <div class="slots-card fade-in ${isLow || isFull ? "low" : ""}">
      <div class="slots-label">
        <span class="stamp">Commission slots</span>
        <span class="count">${label}</span>
      </div>
      <div class="slots-row">${pads}</div>
    </div>`;
}

function renderHome(){
  const cards = PAGES.navOrder.map(key => {
    const p = PAGES[key];
    return `
      <button class="nav-card" data-nav="${key}">
        <div class="illo">${ILLOS[p.illo] || ""}</div>
        <div>
          <h2>${p.title}</h2>
          <div class="from-price">from $${p.basePrice}</div>
        </div>
        <div class="cta">Get an estimate ${iconArrow()}</div>
      </button>`;
  }).join("");

  return `
    <div class="topbar">
      <div class="mark">${iconMark()}</div>
      <div class="brand">COMMISSION ESTIMATOR</div>
    </div>
    ${renderSlots()}
    <div class="intro fade-in">
      <div class="eyebrow">Get an instant estimate</div>
      <h1>What will Ayobami draw?</h1>
      <p>Pick a piece type, choose your options, and see a live price estimate before you commission anything. Note that the final price shown is an estimate. Other factors may change that price.</p>
    </div>
    <div class="nav-grid fade-in">${cards}</div>
  `;
}

function renderDetail(pageKey){
  const page = PAGES[pageKey];
  const picks = state.selections[pageKey];
  const { total, lines } = calcTotal(pageKey);

  const sections = page.sections.map((sec, i) => {
    const chips = sec.options.map(opt => {
      const selected = picks[sec.id] === opt.id;
      const priceLabel = opt.price === 0 ? "included" : ("+$" + opt.price);
      return `
        <div class="opt-chip ${selected ? "selected" : ""}" data-section="${sec.id}" data-option="${opt.id}" tabindex="0" role="button" aria-pressed="${selected}">
          <button class="info-btn" data-info-page="${pageKey}" data-info-section="${sec.id}" data-info-option="${opt.id}" aria-label="More info">i</button>
          <span class="opt-label">${opt.label}</span>
          <span class="opt-price mono">${priceLabel}</span>
        </div>`;
    }).join("");

    return `
      <div class="divider"></div>
      <div class="section-block">
        <div class="section-head">
          <h3>${sec.title}</h3>
          <span class="req">choose one</span>
        </div>
        <div class="scroll-row">${chips}</div>
      </div>`;
  }).join("");

  const breakdownRows = lines.map(l =>
    `<div class="breakdown-row"><span>${l.label}</span><span>${l.price === 0 ? "included" : "+$" + l.price}</span></div>`
  ).join("");

  const displayStart = state.lastTotal;
  setTimeout(() => {
    const el = document.getElementById("price-total");
    if(el) animateCount(el, total);
    state.lastTotal = total;
  }, 0);

  return `
    <button class="back-btn" data-nav="home">${iconBack()} Back</button>
    <div class="page-head fade-in">
      <div class="eyebrow">Estimate builder</div>
      <h1>${page.title}</h1>
      <div class="base">Base price — <span class="mono">$${page.basePrice}</span></div>
    </div>
    ${sections}
    <div class="learn-more-wrap fade-in">
      <button class="learn-more-btn" data-nav="info">
        <span>How commissioning works</span>
        ${iconArrow()}
      </button>
    </div>
    <div class="divider"></div>

    <div class="price-bar">
      <div class="price-bar-inner">
        <div class="price-bar-top" id="breakdown-toggle">
          <div class="label-col">
            <span class="stamp">Price estimate</span>
          </div>
          ${iconChevron("chevron" + (state.breakdownOpen ? " open" : ""))}
          <span class="total" id="price-total" data-value="${displayStart}">$${displayStart}</span>
        </div>
        <div class="breakdown ${state.breakdownOpen ? "open" : ""}" id="breakdown-panel">
          <div class="breakdown-inner">${breakdownRows}</div>
        </div>
      </div>
    </div>
  `;
}

function renderInfo(){
  const steps = INFO_PAGE.steps.map(s => `
    <div class="info-step">
      <h3>${s.title}</h3>
      <p>${s.body}</p>
    </div>`).join("");

  const notes = INFO_PAGE.notes.map(n => `<li>${n}</li>`).join("");

  return `
    <button class="back-btn" data-nav="home">${iconBack()} Back</button>
    <div class="page-head fade-in">
      <div class="eyebrow">Good to know</div>
      <h1>${INFO_PAGE.title}</h1>
      <p class="info-intro">${INFO_PAGE.intro}</p>
    </div>
    <div class="info-steps fade-in">${steps}</div>
    <div class="divider"></div>
    <div class="info-notes fade-in">
      <h3>Notes</h3>
      <ul>${notes}</ul>
    </div>
  `;
}

function renderBanner(route){
  const inner = document.querySelector(".site-banner .banner-inner");
  if(!inner) return;
  const src = BANNERS[route];
  inner.innerHTML = src
    ? `<img src="${src}" alt="Banner">`
    : `<div class="banner-placeholder">
        <svg class="ripple" viewBox="0 0 24 24" fill="none">
          <path d="M2 9c1.5 1.6 3 1.6 4.5 0s3-1.6 4.5 0 3 1.6 4.5 0 3-1.6 4.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M2 15c1.5 1.6 3 1.6 4.5 0s3-1.6 4.5 0 3 1.6 4.5 0 3-1.6 4.5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <span>BANNER GIF GOES HERE</span>
      </div>`;
}

function render(){
  const app = document.getElementById("app");
  if(state.route === "home") app.innerHTML = renderHome();
  else if(state.route === "info") app.innerHTML = renderInfo();
  else app.innerHTML = renderDetail(state.route);
  renderBanner(state.route);
  bindEvents();
}

/* Smoothly counts a $ total from its current displayed value up (or
   down) to `to`, using an ease-out curve. */
function animateCount(el, to){
  const from = parseFloat(el.dataset.value || "0");
  if(from === to){ el.textContent = "$" + to; el.dataset.value = to; return; }
  const duration = 450;
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = Math.round(from + (to - from) * eased);
    el.textContent = "$" + val;
    if(t < 1){
      requestAnimationFrame(tick);
    } else {
      el.textContent = "$" + to;
      el.dataset.value = to;
    }
  }
  requestAnimationFrame(tick);
}

/* Adds a small expanding-circle click ripple to an element (material-
   style feedback). Skipped automatically when reduce-motion is on,
   since the ripple element's own animation is disabled globally. */
function attachRipple(el){
  el.addEventListener("pointerdown", (e) => {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.6;
    const span = document.createElement("span");
    span.className = "ripple-fx";
    span.style.width = span.style.height = size + "px";
    span.style.left = (e.clientX - rect.left - size / 2) + "px";
    span.style.top = (e.clientY - rect.top - size / 2) + "px";
    el.appendChild(span);
    span.addEventListener("animationend", () => span.remove());
    setTimeout(() => span.remove(), 700); // safety net if reduce-motion skips the animation
  });
}

function bindEvents(){
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => go(el.getAttribute("data-nav")));
  });

  document.querySelectorAll(".opt-chip").forEach(chip => {
    chip.addEventListener("click", (e) => {
      if(e.target.closest(".info-btn")) return; // handled separately
      const sectionId = chip.getAttribute("data-section");
      const optionId = chip.getAttribute("data-option");
      state.selections[state.route][sectionId] = optionId;
      render();
    });
    chip.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        chip.click();
      }
    });
  });

  document.querySelectorAll(".info-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const pageKey = btn.getAttribute("data-info-page");
      const sectionId = btn.getAttribute("data-info-section");
      const optionId = btn.getAttribute("data-info-option");
      const sec = PAGES[pageKey].sections.find(s => s.id === sectionId);
      const opt = sec.options.find(o => o.id === optionId);
      openModal(sec, opt);
    });
  });

  document.querySelectorAll(".nav-card, .opt-chip, .learn-more-btn").forEach(attachRipple);

  const toggle = document.getElementById("breakdown-toggle");
  if(toggle){
    toggle.addEventListener("click", () => {
      state.breakdownOpen = !state.breakdownOpen;
      document.getElementById("breakdown-panel").classList.toggle("open", state.breakdownOpen);
      document.querySelector(".chevron").classList.toggle("open", state.breakdownOpen);
    });
  }
}

function openModal(sec, opt){
  const root = document.createElement("div");
  root.className = "modal-overlay";
  root.innerHTML = `
    <div class="modal-card">
      <button class="close" aria-label="Close">✕</button>
      <div class="eyebrow">${sec.title}</div>
      <h3>${opt.label}</h3>
      <div class="modal-price">${opt.price === 0 ? "Included in base price" : "+$" + opt.price}</div>
      ${opt.media ? `<div class="modal-media"><img src="${opt.media}" alt="${opt.label} example" loading="lazy"></div>` : ""}
      <div class="modal-desc">${opt.description}</div>
    </div>
  `;
  document.body.appendChild(root);
  const close = () => {
    root.classList.add("closing");
    root.addEventListener("animationend", () => root.remove(), { once: true });
    setTimeout(() => root.remove(), 400); // safety net if reduce-motion skips the animation
  };
  root.querySelector(".close").addEventListener("click", close);
  root.addEventListener("click", (e) => { if(e.target === root) close(); });
  document.addEventListener("keydown", function esc(e){
    if(e.key === "Escape"){ close(); document.removeEventListener("keydown", esc); }
  });
}

render();
</script>
