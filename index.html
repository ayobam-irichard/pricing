<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     THEME TOKENS — tweak these to restyle the whole site at once
     ============================================================ */
  :root{
    --bg: #21242e;          /* page canvas — slightly darker than the surfaces for depth */
    --surface: #31384A;     /* card / section surface */
    --surface-2: #404961;   /* elevated surface, hover states */
    --border: #637195;      /* borders, dividers (used at reduced opacity below) */
    --highlight: #97A0B8;   /* bright accent — selections, active states, key numbers */
    --text: #F2F4F9;        /* primary text */
    --text-dim: #97A0B8;    /* secondary text (reuses highlight tone) */
    --text-faint: #6b7593;  /* tertiary / muted text */
    --on-highlight: #1c2029;/* text color sitting on top of the bright highlight */

    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Sora', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(151,160,184,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:-0.01em; font-weight:600;}
  .mono{font-family:var(--font-mono);}
  button{font-family:inherit; cursor:pointer;}
  img{max-width:100%; display:block;}
  a{color:inherit;}

  /* layout shell */
  #app{max-width:720px; margin:0 auto; padding:0 20px 150px; min-height:100vh;}
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:24px 0 20px;
  }
  .topbar .mark{
    width:30px; height:30px; flex:none; border-radius:8px;
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
  }
  .topbar .mark svg{width:16px; height:16px; color:var(--highlight);}
  .topbar .brand{font-family:var(--font-display); font-weight:600; font-size:14.5px; color:var(--text);}
  .topbar .tag{
    margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  }

  /* ---------- home / nav screen ---------- */
  .intro{padding:6px 0 30px;}
  .intro .eyebrow{font-size:13px; color:var(--highlight); margin-bottom:10px; font-weight:500;}
  .intro h1{font-size:29px; line-height:1.28; color:var(--text); max-width:20ch;}
  .intro p{color:var(--text-dim); font-size:14.5px; margin-top:12px; max-width:42ch; line-height:1.6;}

  .nav-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .nav-grid{grid-template-columns:1fr;} }

  .nav-card{
    background:var(--surface);
    border:1px solid rgba(99,113,149,0.35);
    border-radius:var(--radius);
    padding:22px 20px 20px;
    text-align:left;
    display:flex; flex-direction:column; gap:16px;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
    color:var(--text);
  }
  .nav-card:hover{background:var(--surface-2); border-color:rgba(151,160,184,0.5);}
  .nav-card:active{transform:scale(0.99);}
  .nav-card .illo{
    width:44px; height:44px; border-radius:10px;
    background:rgba(151,160,184,0.12);
    display:flex; align-items:center; justify-content:center;
  }
  .nav-card .illo svg{width:22px; height:22px; color:var(--highlight);}
  .nav-card h2{font-size:18px; color:var(--text);}
  .nav-card .from-price{font-family:var(--font-mono); font-size:13px; color:var(--text-dim); margin-top:4px;}
  .nav-card .cta{
    margin-top:auto; font-size:13px; color:var(--highlight); font-weight:500;
    display:flex; align-items:center; gap:5px;
  }
  .nav-card .cta svg{width:13px; height:13px; transition:transform .15s ease;}
  .nav-card:hover .cta svg{transform:translateX(3px);}

  /* ---------- detail screen ---------- */
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:none; color:var(--text-dim);
    font-size:13.5px; padding:6px 0; margin-bottom:8px;
  }
  .back-btn:hover{color:var(--text);}
  .back-btn svg{width:14px; height:14px;}

  .page-head{padding:8px 0 6px;}
  .page-head .eyebrow{font-size:12.5px; color:var(--highlight); font-weight:500;}
  .page-head h1{font-size:25px; margin-top:6px;}
  .page-head .base{font-size:13px; color:var(--text-dim); margin-top:8px;}
  .page-head .base .mono{color:var(--highlight);}

  .divider{ height:1px; background:rgba(99,113,149,0.35); margin:28px 0 18px; }

  .section-head{
    display:flex; align-items:baseline; gap:8px;
    margin-bottom:12px;
  }
  .section-head h3{font-size:15.5px; color:var(--text); font-weight:600;}
  .section-head .req{margin-left:auto; font-size:11.5px; color:var(--text-faint);}

  .scroll-row{
    display:flex; gap:10px; overflow-x:auto;
    padding:2px 2px 10px 2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .scroll-row::-webkit-scrollbar{height:5px;}
  .scroll-row::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px; opacity:0.5;}

  .opt-chip{
    position:relative; flex:none;
    min-width:132px;
    background:var(--surface);
    border:1px solid rgba(99,113,149,0.35);
    border-radius:var(--radius-sm);
    padding:13px 13px 12px;
    text-align:left;
    color:var(--text);
    transition:background .12s ease, border-color .12s ease;
  }
  .opt-chip:hover{border-color:rgba(151,160,184,0.55);}
  .opt-chip .opt-label{font-size:13.5px; font-weight:500; padding-right:16px; display:block;}
  .opt-chip .opt-price{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); margin-top:8px; display:block;}
  .opt-chip .info-btn{
    position:absolute; top:9px; right:9px;
    width:18px; height:18px; border-radius:50%;
    border:1px solid rgba(99,113,149,0.5); background:transparent;
    color:var(--text-dim); font-family:var(--font-mono); font-size:10.5px;
    display:flex; align-items:center; justify-content:center; padding:0;
    line-height:1;
  }
  .opt-chip .info-btn:hover{color:var(--text); border-color:var(--highlight);}

  .opt-chip.selected{
    background:var(--highlight);
    border-color:var(--highlight);
  }
  .opt-chip.selected .opt-label{color:var(--on-highlight);}
  .opt-chip.selected .opt-price{color:rgba(28,32,41,0.7);}
  .opt-chip.selected .info-btn{border-color:rgba(28,32,41,0.4); color:rgba(28,32,41,0.75);}

  /* ---------- sticky price bar ---------- */
  .price-bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    pointer-events:none;
  }
  .price-bar-inner{
    pointer-events:auto;
    width:100%; max-width:720px;
    margin:0 20px;
    background:var(--surface);
    border:1px solid rgba(99,113,149,0.4);
    border-bottom:none;
    border-radius:14px 14px 0 0;
    padding:14px 18px 16px;
    box-shadow:0 -16px 32px rgba(0,0,0,0.30);
  }
  .price-bar-top{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .price-bar-top .label-col{display:flex; flex-direction:column; gap:2px;}
  .price-bar-top .stamp{font-size:12px; color:var(--text-dim);}
  .price-bar-top .total{
    margin-left:auto; font-family:var(--font-mono); font-size:21px; font-weight:600; color:var(--highlight);
  }
  .price-bar-top .chevron{width:14px; height:14px; color:var(--text-dim); transition:transform .15s ease;}
  .price-bar-top .chevron.open{transform:rotate(180deg);}

  .breakdown{max-height:0; overflow:hidden; transition:max-height .2s ease;}
  .breakdown.open{max-height:260px; overflow-y:auto; margin-top:12px; padding-top:12px; border-top:1px solid rgba(99,113,149,0.3);}
  .breakdown-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; color:var(--text-dim);}
  .breakdown-row span:last-child{font-family:var(--font-mono); color:var(--text);}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,12,17,0.75);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; padding:0;
  }
  @media (min-width:560px){
    .modal-overlay{align-items:center; padding:20px;}
  }
  .modal-card{
    position:relative;
    background:var(--surface);
    border:1px solid rgba(99,113,149,0.35);
    width:100%; max-width:420px;
    border-radius:16px 16px 0 0;
    padding:22px 22px 26px;
    max-height:82vh; overflow-y:auto;
  }
  @media (min-width:560px){ .modal-card{border-radius:16px;} }
  .modal-card .close{
    position:absolute; top:16px; right:16px;
    width:26px; height:26px; border-radius:50%;
    border:1px solid rgba(99,113,149,0.5); background:transparent; color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .modal-card .close:hover{color:var(--text); border-color:var(--highlight);}
  .modal-card .eyebrow{color:var(--highlight); font-size:11.5px; font-weight:500;}
  .modal-card h3{font-size:18px; padding-right:30px; margin-top:6px;}
  .modal-card .modal-price{font-family:var(--font-mono); color:var(--highlight); font-size:13px; margin-top:8px;}
  .modal-card .modal-media{margin-top:16px; border-radius:10px; overflow:hidden; border:1px solid rgba(99,113,149,0.3);}
  .modal-card .modal-desc{margin-top:16px; font-size:14px; line-height:1.65; color:var(--text-dim);}

  .fade-in{animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ================================================================
   EDIT ME — everything about pricing & content lives in this object
   ================================================================

   HOW TO ADD A NEW OPTION SECTION (e.g. "Pose"):
     Add a new object to the `sections` array of a page:
       {
         id: "pose",                     // unique, no spaces
         title: "Pose",                  // shown as the section header
         options: [ ... see below ... ]
       }

   HOW TO ADD AN OPTION INSIDE A SECTION:
       {
         id: "action-pose",              // unique within this section
         label: "Action Pose",           // shown on the button
         price: 15,                      // added to the total when selected
         description: "A dynamic pose with motion lines and effects.",
         media: "https://i.imgur.com/XXXXXXX.png"   // image or .gif URL, or null
       }
     - The FIRST option in the array is auto-selected by default.
     - `price: 0` is fine for the "included" baseline option.
     - `media` can be a direct Imgur link (https://i.imgur.com/ID.png),
       a direct Giphy link (https://media.giphy.com/media/ID/giphy.gif),
       or `null` if there's nothing to show.

   HOW TO ADD A WHOLE NEW COMMISSION TYPE (e.g. "Emote"):
     Add a new top-level key to PAGES, following the same shape as
     `icon` or `banner` below, then add it to the `navOrder` array
     near the bottom of PAGES so a card appears on the home screen.
================================================================ */

const PAGES = {

          { id:"complex",label:"Complex",price:20, description:"WEAPONS , Lots of features , Annoying/Complex/Many patterns, Etc. (clothes or elsewhere).", media:"https://i.imgur.com/TBJgzdY.png" },

        options:[
          { id:"plain", label:"Plain", price:0, description:"Gradient, Flat Color, Spotlight, Colored shape, or similar.", media:"https://i.imgur.com/rBpiSmc.png" },
          { id:"scene", label:"Custom Scene", price:10, description:"(NOT RECOMMENDED FOR PROFILE PICTURES, WILL NOT SHOW UP WELL.) A small illustrated scene or environment behind the character.", media:"https://placehold.co/400x400/404961/97A0B8?text=I have not made one yet." }

          { id:"image", label: "Image", price: 0, description: "Wow, it's an image!", media: null },
          { id: "gif", label: "Gif (tweened)", price: 55, description: "Woah... It's a gif! Sparkly. Edited in Live2D for a clean tweened style and less drawing for me (which is why it's cheaper).", media: null }
        ]

      {

        title:"Idea Discounts!",
        options:[
          { id: "idea0", label: "I've got an nothing", price: 0, description: "Come into the commission with 0 ideas.", media: null },
          { id:"idea", label:"I've got an idea!", price:-5, description:"Come into the commission with a good idea of what you want drawn. This could be a pose, action, etc.", media:"https://i.imgur.com/EEXeAQT.png" },

        ]
      }
    ]
  },

  banner: {
    title: "Profile Banner",
    basePrice: 40,
    illo: "banner", // which home-screen illustration to draw — see ILLOS below
    sections: [
      {
        id: "complexity",

        options: [
          { id: "simple", label: "Simple", price: 0, description: "Plain design , simple/no clothes.", media: "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.etsystatic.com%2F57503992%2Fr%2Fil%2Fcd67df%2F6867935276%2Fil_794xN.6867935276_l91y.jpg&f=1&nofb=1&ipt=82f3386c57482d5d7105663263e76f9205b7631b42443ecc9804c142721400f1" },

          { id: "image", label: "Image", price: 0, description: "Wow, it's an image!", media: null },
          { id: "gif", label: "Gif (tweened)", price: 70, description: "Woah... It's a gif! Sparkly. Edited in Live2D for a clean tweened style and less drawing for me (which is why it's cheaper). This option includes an animated background scene.", media: null }
      },
      {
        id: "discounts",
        title: "Idea Discounts!",
        options: [
          { id: "idea0", label: "I've got an nothing", price: 0, description: "Come into the commission with 0 ideas.", media: null },
          { id: "idea", label: "I've got an idea!", price: -10, description: "Come into the commission with a good idea of what you want drawn. This could be a pose, action, etc.", media: "https://i.imgur.com/EEXeAQT.png" },
          { id: "idea2", label: "I've got a sketch!!", price: -25, description: "Come into the commission with a rough sketch of what you want drawn. I will work with you if things seem implausible or unpractical. I will likely not change many details from the sketch.", media: "https://i.imgur.com/XtPRhT0.png" },
        ]

      {

  navOrder: ["icon", "banner"]

/* ================================================================
   Below this line is site logic — no need to edit for normal use.
================================================================ */

const ILLOS = {
  icon: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M6.8 18.2c1-2.1 3-3.2 5.2-3.2s4.2 1.1 5.2 3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  banner: `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="11" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 16l4-3.2 3 2.2 3.5-3.6 5 4.6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`
};

const state = {
  route: "home",       // "home" | a key from PAGES
  selections: {},       // { pageKey: { sectionId: optionId } }
  breakdownOpen: false
};

function ensureSelections(pageKey){
  if(state.selections[pageKey]) return;
  const page = PAGES[pageKey];
  const picks = {};
  page.sections.forEach(s => { picks[s.id] = s.options[0].id; });
  state.selections[pageKey] = picks;
}

function calcTotal(pageKey){
  const page = PAGES[pageKey];
  const picks = state.selections[pageKey];
  let total = page.basePrice;
  const lines = [{ label: page.title + " — base", price: page.basePrice }];
  page.sections.forEach(sec => {
    const opt = sec.options.find(o => o.id === picks[sec.id]);
    if(opt){
      total += opt.price;
      lines.push({ label: sec.title + ": " + opt.label, price: opt.price });
    }
  });
  return { total, lines };
}

function go(route){
  state.route = route;
  state.breakdownOpen = false;
  if(route !== "home") ensureSelections(route);
  window.scrollTo(0,0);
  render();
}

function iconChevron(cls){
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconBack(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconArrow(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function iconMark(){
  return `<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><path d="M11 7.5h5.5a2 2 0 0 1 2 2V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
}

function renderHome(){
  const cards = PAGES.navOrder.map(key => {
    const p = PAGES[key];
    return `
      <button class="nav-card" data-nav="${key}">
        <div class="illo">${ILLOS[p.illo] || ""}</div>
        <div>
          <h2>${p.title}</h2>
          <div class="from-price">from $${p.basePrice}</div>
        </div>
        <div class="cta">Get an estimate ${iconArrow()}</div>
      </button>`;
  }).join("");

  return `
    <div class="topbar">
      <div class="mark">${iconMark()}</div>
      <div class="brand">COMMISSION ESTIMATOR</div>
    </div>
    <div class="intro fade-in">
      <div class="eyebrow">Get an instant estimate</div>
      <h1>What are we drawing?</h1>
      <p>Pick a piece type, choose your options, and see a live price estimate before you commission anything.</p>
    </div>
    <div class="nav-grid fade-in">${cards}</div>
  `;
}

function renderDetail(pageKey){
  const page = PAGES[pageKey];
  const picks = state.selections[pageKey];
  const { total, lines } = calcTotal(pageKey);

  const sections = page.sections.map((sec, i) => {
    const chips = sec.options.map(opt => {
      const selected = picks[sec.id] === opt.id;
      const priceLabel = opt.price === 0 ? "included" : ("+$" + opt.price);
      return `
        <div class="opt-chip ${selected ? "selected" : ""}" data-section="${sec.id}" data-option="${opt.id}">
          <button class="info-btn" data-info-page="${pageKey}" data-info-section="${sec.id}" data-info-option="${opt.id}" aria-label="More info">i</button>
          <span class="opt-label">${opt.label}</span>
          <span class="opt-price mono">${priceLabel}</span>
        </div>`;
    }).join("");

    return `
      <div class="divider"></div>
      <div class="section-block">
        <div class="section-head">
          <h3>${sec.title}</h3>
          <span class="req">choose one</span>
        </div>
        <div class="scroll-row">${chips}</div>
      </div>`;
  }).join("");

  const breakdownRows = lines.map(l =>
    `<div class="breakdown-row"><span>${l.label}</span><span>${l.price === 0 ? "included" : "+$" + l.price}</span></div>`
  ).join("");

  setTimeout(() => {
    const el = document.getElementById("price-total");
    if(el) el.textContent = "$" + total;
  }, 0);

  return `
    <button class="back-btn" data-nav="home">${iconBack()} Back</button>
    <div class="page-head fade-in">
      <div class="eyebrow">Estimate builder</div>
      <h1>${page.title}</h1>
      <div class="base">Base price — <span class="mono">$${page.basePrice}</span></div>
    </div>
    ${sections}
    <div class="divider"></div>

    <div class="price-bar">
      <div class="price-bar-inner">
        <div class="price-bar-top" id="breakdown-toggle">
          <div class="label-col">
            <span class="stamp">Price estimate</span>
          </div>
          ${iconChevron("chevron" + (state.breakdownOpen ? " open" : ""))}
          <span class="total" id="price-total">$${total}</span>
        </div>
        <div class="breakdown ${state.breakdownOpen ? "open" : ""}" id="breakdown-panel">${breakdownRows}</div>
      </div>
    </div>
  `;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = state.route === "home" ? renderHome() : renderDetail(state.route);
  bindEvents();
}

function bindEvents(){
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => go(el.getAttribute("data-nav")));
  });

  document.querySelectorAll(".opt-chip").forEach(chip => {
    chip.addEventListener("click", (e) => {
      if(e.target.closest(".info-btn")) return; // handled separately
      const sectionId = chip.getAttribute("data-section");
      const optionId = chip.getAttribute("data-option");
      state.selections[state.route][sectionId] = optionId;
      render();
    });
  });

  document.querySelectorAll(".info-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const pageKey = btn.getAttribute("data-info-page");
      const sectionId = btn.getAttribute("data-info-section");
      const optionId = btn.getAttribute("data-info-option");
      const sec = PAGES[pageKey].sections.find(s => s.id === sectionId);
      const opt = sec.options.find(o => o.id === optionId);
      openModal(sec, opt);
    });
  });

  const toggle = document.getElementById("breakdown-toggle");
  if(toggle){
    toggle.addEventListener("click", () => {
      state.breakdownOpen = !state.breakdownOpen;
      document.getElementById("breakdown-panel").classList.toggle("open", state.breakdownOpen);
      document.querySelector(".chevron").classList.toggle("open", state.breakdownOpen);
    });
  }
}

function openModal(sec, opt){
  const root = document.createElement("div");
  root.className = "modal-overlay";
  root.innerHTML = `
    <div class="modal-card fade-in">
      <button class="close" aria-label="Close">✕</button>
      <div class="eyebrow">${sec.title}</div>
      <h3>${opt.label}</h3>
      <div class="modal-price">${opt.price === 0 ? "Included in base price" : "+$" + opt.price}</div>
      ${opt.media ? `<div class="modal-media"><img src="${opt.media}" alt="${opt.label} example" loading="lazy"></div>` : ""}
      <div class="modal-desc">${opt.description}</div>
    </div>
  `;
  document.body.appendChild(root);
  const close = () => root.remove();
  root.querySelector(".close").addEventListener("click", close);
  root.addEventListener("click", (e) => { if(e.target === root) close(); });
  document.addEventListener("keydown", function esc(e){
    if(e.key === "Escape"){ close(); document.removeEventListener("keydown", esc); }
  });
}

render();
</script>

</body>
</html>
